services:
  - type: web
    name: telegram-naukri-reminder
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: REMINDER_HOUR
        value: 9
      - key: REMINDER_MINUTE
        value: 0
      - key: TIMEZONE
        value: Asia/Kolkata
